tools:
  - class_name: "verl.tools.code_localization.inspector_tool.GetMethodsOfClassTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_methods_of_class"
        description: "Get all method signatures of a specific class in the specified file."
        parameters:
          type: "object"
          properties:
            file_name:
              type: "string"
              description: "The full file path (e.g., 'django/db/models/query.py')"
            class_name:
              type: "string"
              description: "The class name (e.g., 'QuerySet')"
          required: ["file_name", "class_name"]

  - class_name: "verl.tools.code_localization.inspector_tool.GetFileFunctionsTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_file_functions"
        description: "Get all module-level function signatures in the specified file."
        parameters:
          type: "object"
          properties:
            file_name:
              type: "string"
              description: "The full file path (e.g., 'django/db/models/query.py')"
          required: ["file_name"]

  - class_name: "verl.tools.code_localization.inspector_tool.GetFileClassesTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_file_classes"
        description: "Get all class signatures in the specified file."
        parameters:
          type: "object"
          properties:
            file_name:
              type: "string"
              description: "The full file path (e.g., 'django/db/models/query.py')"
          required: ["file_name"]

  - class_name: "verl.tools.code_localization.inspector_tool.GetCodeOfFunctionTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_code_of_function"
        description: "Get the source code implementation of a specific module-level function in a file."
        parameters:
          type: "object"
          properties:
            file_name:
              type: "string"
              description: "The full file path"
            func_name:
              type: "string"
              description: "The function name"
          required: ["file_name", "func_name"]

  - class_name: "verl.tools.code_localization.inspector_tool.GetCodeOfClassMethodTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_code_of_class_method"
        description: "Get the source code implementation of a specific method within a class."
        parameters:
          type: "object"
          properties:
            file_name:
              type: "string"
              description: "The full file path"
            class_name:
              type: "string"
              description: "The class name"
            func_name:
              type: "string"
              description: "The method name"
          required: ["file_name", "class_name", "func_name"]

  - class_name: "verl.tools.code_localization.inspector_tool.GetCallersTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_callers"
        description: "Get a list of functions that call the specified function. Returns callers in the format 'file:function' or 'file:Class.method'."
        parameters:
          type: "object"
          properties:
            location:
              type: "string"
              description: "The function location in format 'file_path:function_name' or 'file_path:ClassName.method_name'"
          required: ["location"]

  - class_name: "verl.tools.code_localization.inspector_tool.GetCalleesTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_callees"
        description: "Get a list of functions that are called by the specified function. Returns callees in the format 'file:function' or 'file:Class.method'."
        parameters:
          type: "object"
          properties:
            location:
              type: "string"
              description: "The function location in format 'file_path:function_name' or 'file_path:ClassName.method_name'"
          required: ["location"]

  - class_name: "verl.tools.code_localization.inspector_tool.InspectorExitTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "exit"
        description: "Call this when you have finished exploring and are ready to return your findings."
        parameters:
          type: "object"
          properties: {}
          required: []
