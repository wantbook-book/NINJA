hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 2048
  max_response_length: 4096
  train_batch_size: 16
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: 'error'

actor_rollout_ref:
  hybrid_engine: True
  rollout:
    name: vllm
    multi_turn:
      enable: True
      format: hermes
      max_assistant_turns: 15
      max_user_turns: 15
      max_parallel_calls: 1
      max_tool_response_length: 8000
      tool_response_truncate_side: both

      # Code localization specific config
      training_role: null
      navigator_tool_config_path: null
      inspector_tool_config_path: null
      remote_api_base: null
      remote_api_key: null
      remote_model_name: null
      max_navigator_turns: 10
      max_inspector_turns: 10
      sub_agent_parallelism: 3
      length_penalty_coef: 1.0
      top_k_predictions: 5
      reward_metric: dice
      reward_acc_at_k: null
      reward_acc_at_k_from_gt: false
      trajectory_save_dir: null
      run_id: null

algorithm:
  adv_estimator: grpo

reward:
  reward_manager:
    source: register
    name: code_localization
